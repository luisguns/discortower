<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1020" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; object-src 'none'; base-uri 'none'" />
    <title>Baixar splotys LTS</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; color: #f6f4ff; background: #0f1020; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; background: radial-gradient(circle at 75% 20%, rgba(124,140,255,.15), transparent 34%), #0f1020; }
      main { width: min(100%, 470px); padding: 36px; border: 1px solid #343852; border-radius: 26px; background: #17182b; box-shadow: 0 28px 90px rgba(0,0,0,.38); }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 38px; }
      .mark { display: grid; width: 46px; height: 46px; place-items: center; border-radius: 15px; background: #ff6b8a; color: #17182b; }
      .mark svg { width: 38px; fill: currentColor; }
      .mark path:last-child { fill: none; stroke: #fff7fa; stroke-linecap: round; stroke-width: 2.3; }
      .brand strong { font-size: 22px; letter-spacing: .07em; }
      .brand small { display: block; margin-top: 2px; color: #9ca3bd; font-size: 10px; }
      p:first-of-type { margin: 0 0 10px; color: #ff6b8a; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(36px, 9vw, 54px); line-height: .98; }
      #status { min-height: 44px; margin: 18px 0 24px; color: #9ca3bd; font-size: 14px; line-height: 1.6; }
      button, a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 20px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 700; text-decoration: none; }
      button { border: 0; background: #ff6b8a; color: #17182b; cursor: pointer; }
      a { margin-left: 8px; border: 1px solid #454b68; color: #f6f4ff; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M13 15.5A5.5 5.5 0 0 1 18.5 10h11a5.5 5.5 0 0 1 5.5 5.5v9a5.5 5.5 0 0 1-5.5 5.5h-5.7L16 36v-6.6a5.5 5.5 0 0 1-3-4.9v-9Z"/><path d="M18 20.2c1.5-1.5 3-2.2 4.5-2.2s3 .7 4.5 2.2 3 2.3 4.5 2.3M18 25.7c1.2-1.1 2.5-1.7 3.8-1.7s2.6.6 3.9 1.7"/></svg></span>
        <span><strong>splotys</strong><small>versão estável para Windows</small></span>
      </div>
      <p>Download LTS</p>
      <h1>Preparando seu instalador.</h1>
      <div id="status" role="status">Buscando a versão mais recente e segura para Windows x64…</div>
      <button id="retry" type="button" hidden>Tentar novamente</button>
      <a href="/">Voltar ao site</a>
    </main>
    <script>
      const status = document.querySelector('#status')
      const retry = document.querySelector('#retry')
      const findInstaller = (assets) => assets.find(({ name }) => name === 'splotys-LTS-Windows-x64.exe')
        || assets.find(({ name }) => /^splotys-Setup-[\w.-]+-x64\.exe$/i.test(name || ''))
        || assets.find(({ name }) => /^DiscorTower-Setup-[\w.-]+-x64\.exe$/i.test(name || ''))

      const start = async () => {
        retry.hidden = true
        status.textContent = 'Buscando a versão mais recente e segura para Windows x64…'
        try {
          const response = await fetch('https://api.github.com/repos/luisguns/discortower/releases/latest', { headers: { Accept: 'application/vnd.github+json' } })
          if (!response.ok) throw new Error('release unavailable')
          const release = await response.json()
          const installer = findInstaller(release.assets || [])
          if (!installer || !installer.browser_download_url) throw new Error('installer unavailable')
          status.textContent = 'Download iniciado. Você pode fechar esta página quando o arquivo aparecer.'
          window.location.assign(installer.browser_download_url)
        } catch {
          status.textContent = 'Não foi possível preparar o download agora. Verifique sua conexão e tente novamente.'
          retry.hidden = false
        }
      }

      retry.addEventListener('click', start)
      start()
    </script>
  </body>
</html>
