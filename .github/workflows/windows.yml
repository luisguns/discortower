name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "A tag $env:GITHUB_REF_NAME não corresponde à versão $packageVersion do package.json. Use $expectedTag."
          }

      - name: Build installer and portable app
        shell: pwsh
        run: |
          npm run desktop:dist:windows 2>&1 | Tee-Object -FilePath desktop-build.log
          $desktopExitCode = $LASTEXITCODE
          if ($desktopExitCode -ne 0) {
            $desktopError = (Get-Content desktop-build.log -Tail 40) -join "`n"
            $desktopError = $desktopError.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows desktop packaging failed::$desktopError"
            exit $desktopExitCode
          }
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_AUTH_REDIRECT_URL: ${{ vars.VITE_SUPABASE_AUTH_REDIRECT_URL }}
          WINDOWS_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/') }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Create stable LTS download name
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath release -Filter 'DiscorTower-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'O instalador Setup não foi gerado.' }
          Copy-Item -LiteralPath $setup.FullName -Destination 'release/DiscorTower-LTS-Windows-x64.exe'

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: DiscorTower-Windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          compression-level: 0

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe release/latest.yml release/*.blockmap --generate-notes --title "DiscorTower $GITHUB_REF_NAME"
