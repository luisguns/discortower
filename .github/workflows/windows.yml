name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable app
        run: npm run desktop:dist:windows
        env:
          VITE_LIVEKIT_TOKEN_SERVER_ID: ${{ vars.VITE_LIVEKIT_TOKEN_SERVER_ID }}

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Ford-Kall-Windows-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe --generate-notes --title "Ford Kall $GITHUB_REF_NAME"
